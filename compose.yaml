services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./jellyfin/config:/config
      - /mnt/media/Plex:/data
    ports:
      - "8096:8096"

  samba:
    image: dperson/samba
    container_name: samba
    restart: unless-stopped
    ports:
      - "139:139"
      - "445:445"
    environment:
      - TZ=America/Chicago
    volumes:
      - /mnt/media:/media
      - /srv/general-share:/general
      - /srv/bros-share:/bros
      - ./samba/smb.conf:/etc/samba/smb.conf
    command: >
      -u "evan;${SAMBA_EVAN_PASSWORD}"
      -u "karla;${SAMBA_KARLA_PASSWORD}"
      -u "bros;${SAMBA_BROS_PASSWORD}"

  wireguard:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wireguard
    restart: unless-stopped
    network_mode: host
    environment:
      - WG_HOST=${PUBLIC_DOMAIN}
      - PASSWORD_HASH=${WG_PASSWORD_HASH}
      - PGID=1000
      - PUID=1000
      - WG_DEFAULT_DNS=${SERVER_LAN_IP}
      # Friends' peers live in 10.8.0.200/29 (set each one's address in the
      # wg-easy UI) and may only reach Samba (445), Jellyfin (8096),
      # Pi-hole DNS, and Caddy (80) — which itself only serves them
      # jellyfin.evan (see the friend check in caddy/Caddyfile). Nothing else
      # on the server, the LAN, or other peers.
      # Samba/Jellyfin are Docker-published (DNAT'd into FORWARD), hence
      # matching on the pre-DNAT port via conntrack. The rest are wg-easy's
      # defaults (WG_POST_UP replaces rather than extends them), with
      # MASQUERADE pointed at this host's real NIC (enp2s0, not eth0) plus
      # DOCKER-USER accepts: Docker sets the nft FORWARD policy to DROP, which
      # otherwise blocks every peer from the LAN/internet. wg-easy's own
      # iptables is legacy, so those two go through iptables-nft explicitly;
      # the friend DROPs above (legacy) still apply on top.
      - >-
        WG_POST_UP=
        iptables -A INPUT -i wg0 -s 10.8.0.200/29 -p udp --dport 53 -j ACCEPT;
        iptables -A INPUT -i wg0 -s 10.8.0.200/29 -p tcp --dport 53 -j ACCEPT;
        iptables -A INPUT -i wg0 -s 10.8.0.200/29 -p tcp --dport 80 -j ACCEPT;
        iptables -A INPUT -i wg0 -s 10.8.0.200/29 -j DROP;
        iptables -A FORWARD -i wg0 -s 10.8.0.200/29 -m conntrack --ctproto tcp --ctorigdstport 445 -j ACCEPT;
        iptables -A FORWARD -i wg0 -s 10.8.0.200/29 -m conntrack --ctproto tcp --ctorigdstport 8096 -j ACCEPT;
        iptables -A FORWARD -i wg0 -s 10.8.0.200/29 -j DROP;
        iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o enp2s0 -j MASQUERADE;
        iptables-nft -I DOCKER-USER -i wg0 -j ACCEPT;
        iptables-nft -I DOCKER-USER -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT;
        iptables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -A FORWARD -i wg0 -j ACCEPT;
        iptables -A FORWARD -o wg0 -j ACCEPT
      - >-
        WG_POST_DOWN=
        iptables -D INPUT -i wg0 -s 10.8.0.200/29 -p udp --dport 53 -j ACCEPT;
        iptables -D INPUT -i wg0 -s 10.8.0.200/29 -p tcp --dport 53 -j ACCEPT;
        iptables -D INPUT -i wg0 -s 10.8.0.200/29 -p tcp --dport 80 -j ACCEPT;
        iptables -D INPUT -i wg0 -s 10.8.0.200/29 -j DROP;
        iptables -D FORWARD -i wg0 -s 10.8.0.200/29 -m conntrack --ctproto tcp --ctorigdstport 445 -j ACCEPT;
        iptables -D FORWARD -i wg0 -s 10.8.0.200/29 -m conntrack --ctproto tcp --ctorigdstport 8096 -j ACCEPT;
        iptables -D FORWARD -i wg0 -s 10.8.0.200/29 -j DROP;
        iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o enp2s0 -j MASQUERADE;
        iptables-nft -D DOCKER-USER -i wg0 -j ACCEPT;
        iptables-nft -D DOCKER-USER -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT;
        iptables -D INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -D FORWARD -i wg0 -j ACCEPT;
        iptables -D FORWARD -o wg0 -j ACCEPT
    volumes:
      - ./wireguard:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Chicago
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
      - FTLCONF_webserver_port=8080
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/logs:/var/log/caddy

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - VPN_PORT_FORWARDING=on
      # Pushes the forwarded port into qBittorrent's own listen-port setting
      # whenever it changes, since qBittorrent has no native awareness of
      # gluetun's port forwarding. Requires qBittorrent's WebUI setting
      # "Bypass authentication for clients on localhost" to be enabled.
      - 'VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c ''wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8081/api/v2/app/setPreferences'''
      - 'VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c ''wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8081/api/v2/app/setPreferences'''
    volumes:
      - ./gluetun:/gluetun
    ports:
      - "8081:8081"
      - "9696:9696"
      - "8191:8191"
      - "5656:5656" # kapowarr
      - "8084:8084" # shelfmark

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8081
    volumes:
      - ./qbittorrent:/config
      - /mnt/media/Plex:/data
    depends_on:
      - gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./prowlarr:/config
    depends_on:
      - gluetun

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=info
      - TZ=America/Chicago
    depends_on:
      - gluetun

  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: unless-stopped
    # Behind the VPN even though most of its downloads are direct HTTPS
    # (GetComics + file hosts), not torrents. Torrent links it finds are
    # handed to qBittorrent at localhost:8081 (shared netns).
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./kapowarr/db:/app/db
      # Same filesystem as the library so finished downloads move instantly.
      - /mnt/media/Plex/downloads/kapowarr:/app/temp_downloads
      # Same mount as qBittorrent so the paths it reports resolve as-is.
      # Add /data/Comics as the root folder in Kapowarr's settings.
      - /mnt/media/Plex:/data
    depends_on:
      - gluetun

  shelfmark:
    # -lite has no bundled Chromium bypasser; it uses the FlareSolverr
    # already running in gluetun's netns instead (saves a few hundred MB).
    image: ghcr.io/calibrain/shelfmark-lite:latest
    container_name: shelfmark
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - EXT_BYPASSER_URL=http://localhost:8191
    volumes:
      - ./shelfmark:/config
      - /mnt/media/Plex/Books:/books
      # Same mount as qBittorrent — Shelfmark has to read the exact path
      # qBittorrent reports for torrent downloads.
      - /mnt/media/Plex:/data
    depends_on:
      - gluetun

  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./kavita:/config
      # Read-only: Kavita only reads the library (covers/metadata live in
      # /config). Libraries: /data/Comics and /data/Books.
      - /mnt/media/Plex:/data:ro
    ports:
      - "5000:5000"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./radarr:/config
      - /mnt/media/Plex:/data
    ports:
      - "7878:7878"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      # PUID/PGID=0 (root): the image's entrypoint uses `su-exec` to drop to
      # PUID/PGID, which strips supplementary groups — so `group_add` for
      # docker.sock's group can't survive it. Running as root is this image's
      # documented fallback for exactly that case, and buys nothing extra to
      # attack since docker.sock access is already host-root-equivalent.
      - PUID=0
      - PGID=0
      - HOMEPAGE_ALLOWED_HOSTS=${SERVER_LAN_IP}:3000,dashboard.evan
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_PIHOLE_PASSWORD=${PIHOLE_PASSWORD}
      - HOMEPAGE_VAR_WG_PASSWORD=${WG_ADMIN_PASSWORD}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${BAZARR_API_KEY}
      - HOMEPAGE_VAR_SERVER_IP=${SERVER_LAN_IP}
      - HOMEPAGE_VAR_GCAL_ICS_URL=${GCAL_ICS_URL}
      - HOMEPAGE_VAR_FINNHUB_API_KEY=${FINNHUB_API_KEY}
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/media:/mnt/media:ro
    ports:
      - "3000:3000"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./sonarr:/config
      - /mnt/media/Plex:/data
    ports:
      - "8989:8989"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./bazarr:/config
      # Same mount as radarr/sonarr so paths they report resolve as-is
      # (no path mapping needed in Bazarr's settings).
      - /mnt/media/Plex:/data
    ports:
      - "6767:6767"

  # Syncs TRaSH Guides profiles/custom formats into Radarr + Sonarr once a day
  # (config: recyclarr/recyclarr.yml). Talks only to the *arrs and GitHub —
  # downloads no media, so it doesn't need to sit behind gluetun.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    user: 1000:1000
    environment:
      - TZ=America/Chicago
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
    volumes:
      - ./recyclarr:/config
    depends_on:
      - radarr
      - sonarr

  sunshine:
    build: ./sunshine
    container_name: sunshine
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
      # libvirtualhid's Linux backend (uhid_backend.cpp) hard-codes this
      # path for full-featured gamepad emulation (motion/touchpad/RGB) —
      # separate from /dev/uinput above, which only covers keyboard/mouse
      # and basic input. Without it, every gamepad type is silently
      # disabled ("gamepads.virtualhid-not-available" ->
      # "No gamepad input is available") — no controller works from any
      # client. (A CAP_SYS_ADMIN error logged around the same time is an
      # unrelated red herring: Sunshine's own KMS-capture self-test
      # probing, harmless and expected since this setup uses X11 capture.)
      - /dev/uhid:/dev/uhid
    group_add:
      - "992" # host `render` group — VAAPI access to /dev/dri/renderD128
      - "996" # host `input` group — access to /dev/uinput and /dev/input/*
      - "44" # host `video` group — modesetting access to /dev/dri/card0 (real HDMI dummy plug display)
    device_cgroup_rules:
      # Docker's device cgroup only allowlists the exact paths under
      # `devices:` below — bind-mounting /dev/input (needed so newly
      # created virtual devices show up live) makes the paths visible but
      # the cgroup still blocks open() on them (EPERM) without this. 13 is
      # Linux's INPUT_MAJOR for /dev/input/event*, mouse*, js*, etc.
      - "c 13:* rmw"
    environment:
      - TZ=America/Chicago
      - SERVER_LAN_IP=${SERVER_LAN_IP}
    volumes:
      - ./sunshine/home:/home/lizard
      - /mnt/media/ROMs:/roms
      # Bind mount (not `devices:`) so newly created virtual mouse/keyboard/
      # gamepad nodes (created dynamically via /dev/uinput when a stream
      # session starts) actually show up inside the container — `devices:`
      # only snapshots fixed paths at container start.
      - /dev/input:/dev/input
      # Xorg's udev input backend needs the host's udev device database to
      # identify these as mouse/keyboard (ID_INPUT_* properties) — there's
      # no udev daemon running inside the container itself.
      - /run/udev:/run/udev:ro
    # network_mode: host above already exposes Sunshine's ports directly
    # (needed for it to share the host's netns and receive udev hotplug
    # events for newly created virtual input devices — see group_add above).

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - ./uptime-kuma:/app/data
    ports:
      - "3001:3001"

  nuzlocke-tracker:
    # Own app: github.com/evan-lundell/nuzlocke-tracker (image built by its CI).
    # Update: docker compose pull nuzlocke-tracker && docker compose up -d nuzlocke-tracker
    image: ghcr.io/evan-lundell/nuzlocke-tracker:latest
    container_name: nuzlocke-tracker
    restart: unless-stopped
    volumes:
      # SQLite DB (runs + location edits). Image runs as uid 1000, so this
      # dir must be owned 1000:1000.
      - ./nuzlocke/data:/data
    ports:
      - "3456:3000"
