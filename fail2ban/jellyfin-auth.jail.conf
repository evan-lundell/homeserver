# Drop-in jail for fail2ban. Install with:
#   sudo cp fail2ban/jellyfin-auth.conf /etc/fail2ban/filter.d/jellyfin-auth.conf
#   sudo cp fail2ban/jellyfin-auth.jail.conf /etc/fail2ban/jail.d/jellyfin-auth.conf
#   sudo systemctl restart fail2ban
#
# 5 failed logins against Jellyfin's auth endpoint within 10 minutes bans
# the IP for an hour, via the host's iptables (nft-backed on this system).
[jellyfin-auth]
enabled = true
filter = jellyfin-auth
logpath = /home/evan/homeserver/caddy/logs/jellyfin-access.log
maxretry = 5
findtime = 600
bantime = 3600
action = iptables-allports[name=jellyfin-auth]
