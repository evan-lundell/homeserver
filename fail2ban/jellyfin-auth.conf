[Definition]
# Caddy's JSON access log puts fields in a fixed order, but lookaheads make
# this independent of that order (and robust to log format changes within
# reason). Matches a failed login against Jellyfin's auth endpoint
# specifically, not just any 401, to keep false positives low. Real Jellyfin
# clients send the URI lowercase (/Users/authenticatebyname) even though the
# API is documented in PascalCase, so this matches case-insensitively.
failregex = ^(?=.*"remote_ip":"<HOST>")(?=.*"uri":"(?i:\/users\/authenticatebyname)")(?=.*"status":401)
ignoreregex =
