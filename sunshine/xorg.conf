Section "Device"
    Identifier "intel_videocard"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
EndSection

Section "Monitor"
    Identifier "hdmi_monitor"
    Option "PreferredMode" "1920x1080"
EndSection

Section "Screen"
    Identifier "hdmi_screen"
    Device "intel_videocard"
    Monitor "hdmi_monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "hdmi_layout"
    Screen "hdmi_screen"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
EndSection
