# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
################################################################################
## Recyclarr — syncs TRaSH Guides quality profiles + custom formats into
## Radarr/Sonarr (daily, via the container's built-in cron).
##
## Two profile families live side by side in each app:
##   - "HD Bluray + WEB" / "WEB-1080p": TRaSH's profiles, managed here. Used for
##     a few films/shows where quality matters more than space.
##   - "1080p Compact": hand-built (x265-preferring, size-capped), NOT managed
##     here. Recyclarr leaves profiles and custom formats it doesn't own alone.
##
## quality_definition is deliberately NOT synced: size limits in Radarr/Sonarr
## are global (shared by every profile), and TRaSH's minimums (e.g. 50 MB/min
## for Bluray-1080p) would reject every compact x265 encode. Globals are set by
## hand instead (low minimums, near-unlimited maximums); the compact profiles
## enforce their own size caps through "Compact: Oversized..." custom formats.
##
## Templates these were based on: `recyclarr config create -t hd-bluray-web`
## and `-t web-1080p`.
################################################################################

radarr:
  hd-bluray-web:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD (blocks x265 at 1080p)
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats

sonarr:
  web-1080p:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD (blocks x265 at 1080p)
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles (Language: Not Original)
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
